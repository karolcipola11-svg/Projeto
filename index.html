<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prévia local do Projeto" />
    <title>Projeto — Prévia</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #17233d;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 15%, rgba(94, 92, 230, 0.18), transparent 28rem),
          radial-gradient(circle at 82% 82%, rgba(32, 190, 150, 0.16), transparent 26rem),
          #f4f7fb;
      }

      main {
        width: min(92%, 780px);
        padding: clamp(2.5rem, 7vw, 5rem);
        border: 1px solid rgba(23, 35, 61, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 28px 80px rgba(45, 55, 90, 0.13);
        text-align: center;
        backdrop-filter: blur(16px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        background: #eafaf4;
        color: #08795b;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .status::before {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #16ae82;
        content: "";
        box-shadow: 0 0 0 5px rgba(22, 174, 130, 0.13);
      }

      h1 {
        margin: 1.7rem 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 34rem;
        margin: 0 auto;
        color: #5c667d;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      strong { color: #4e4bcf; }
    </style>
  </head>
  <body>
    <main>
      <span class="status">Prévia local ativa</span>
      <h1>Seu site está pronto para visualizar.</h1>
      <p>
        Esta página aparece somente no seu computador. Você pode revisar tudo
        com tranquilidade antes de <strong>publicar o site</strong>.
      </p>
    </main>
  </body>
</html>
